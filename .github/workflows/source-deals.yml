name: Source deals

# Every morning, finds up to 15 popular Amazon.in deals through the Amazon Creators API
# (the official Associates product feed, no Amazon login and no page reading), adds the
# ones that pass the rules in deals-admin/lib/deals.mjs and starts a deploy. The Telegram
# workflow then posts them one every 30 minutes.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: "Only print what would be added"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: deal-data
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AMAZON_CREATORS_ID: ${{ secrets.AMAZON_CREATORS_ID }}
      AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
      AMAZON_CREATORS_VERSION: ${{ secrets.AMAZON_CREATORS_VERSION }}
    steps:
      - name: Check the API keys
        id: keys
        run: |
          if [ -z "$AMAZON_CREATORS_ID" ] || [ -z "$AMAZON_CREATORS_SECRET" ]; then
            echo '::warning::Add AMAZON_CREATORS_ID and AMAZON_CREATORS_SECRET in Settings > Secrets and variables > Actions to turn on daily deals.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.keys.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        if: steps.keys.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find deals through the API
        if: steps.keys.outputs.ready == 'true'
        run: node deals-admin/fetch-deals.mjs "$RUNNER_TEMP/candidates.json"

      - name: Add the deals
        if: steps.keys.outputs.ready == 'true'
        env:
          DRY: ${{ inputs.dry }}
        run: |
          if [ "$DRY" = "true" ]; then
            node deals-admin/import-deals.mjs "$RUNNER_TEMP/candidates.json" --dry
          else
            node deals-admin/import-deals.mjs "$RUNNER_TEMP/candidates.json"
          fi

      # A push made with the workflow token doesn't start other workflows, so start the deploy here
      - name: Publish
        if: steps.keys.outputs.ready == 'true' && inputs.dry != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE='Clean Portfolio/deals/deals.json'
          git diff --quiet -- "$FILE" && { echo 'No new deals to publish.'; exit 0; }
          ADDED=$(git diff -U0 -- "$FILE" | grep -c '^+ *"id": "a-' || true)
          git config user.name 'Dibyajyoti Kabi'
          git config user.email '166307538+Dibyajyotikabi@users.noreply.github.com'
          git add "$FILE"
          git commit -m "feat: add ${ADDED} new deals"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            [ "$attempt" = 3 ] && { echo 'Could not push deals.json'; exit 1; }
            sleep $((attempt * 5))
          done
          gh workflow run deploy.yml --ref main
