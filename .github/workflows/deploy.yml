name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Tell IndexNow about the new build
        run: |
          curl -sS --max-time 30 -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"host":"dibyajyotikabi.com","key":"827e7df31e49331a435d8b7a0f6416fb","keyLocation":"https://dibyajyotikabi.com/827e7df31e49331a435d8b7a0f6416fb.txt","urlList":["https://dibyajyotikabi.com/","https://dibyajyotikabi.com/projects.html","https://dibyajyotikabi.com/about.html","https://dibyajyotikabi.com/contact.html","https://dibyajyotikabi.com/writing.html"]}' \
            -o /dev/null -w 'IndexNow: %{http_code}\n' || true
